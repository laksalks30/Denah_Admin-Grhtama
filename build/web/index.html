  <!-- Auto-Sync & Cache Purge: Sinkronisasi instan HP & PC -->
  <script>
    var APP_VERSION = '20261018_v7';

    // 1. Hapus Service Worker & Cache Storage lama
    function purgeCaches() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var j = 0; j < keys.length; j++) {
            caches.delete(keys[j]);
          }
        });
      }
    }
    purgeCaches();

    // 2. Auto-cek versi terbaru dari server secara berkala
    function checkLiveVersion() {
      fetch('sync_version.json?_t=' + Date.now(), { cache: 'no-store' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.build_id && data.build_id !== APP_VERSION) {
            console.log('[AppUpdater] Versi baru terdeteksi (' + data.build_id + '). Memperbarui...');
            purgeCaches();
            try { localStorage.setItem('app_version', data.build_id); } catch(e) {}
            window.location.reload();
          }
        })
        .catch(function() {});
    }

    // Cek saat halaman dimuat
    checkLiveVersion();

    // Cek setiap kali pengguna kembali membuka tab di HP (visibilitychange)
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        checkLiveVersion();
      }
    });

    // Cek berkala setiap 20 detik jika tab tetap terbuka
    setInterval(checkLiveVersion, 20000);
  </script>

  <!-- heic2any: Converter otomatis format iPhone HEIC/HEIF ke JPEG murni -->
  <script src="heic2any.min.js"></script>
  <script>
    window.convertHeicIfNeeded = async function(file) {
      if (!file) return file;
      var name = (file.name || '').toLowerCase();
      var type = (file.type || '').toLowerCase();
      if (name.endsWith('.heic') || name.endsWith('.heif') || type.indexOf('heic') !== -1 || type.indexOf('heif') !== -1) {
        if (typeof heic2any === 'function') {
          try {
            var converted = await heic2any({
              blob: file,
              toType: 'image/jpeg',
              quality: 0.75
            });
            var finalBlob = Array.isArray(converted) ? converted[0] : converted;
            return new File([finalBlob], file.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
          } catch(err) {
            console.warn('[HEIC] Gagal konversi otomatis heic2any:', err);
          }
        }
      }
      return file;
    };
  </script>

  <script>
    var bar = document.getElementById('loading-bar');
    var progress = 0;
    var interval = setInterval(function() {
      progress = Math.min(progress + (progress < 50 ? 5 : 2), 90);
      if (bar) bar.style.width = progress + '%';
    }, 60);

    function removeLoadingScreen() {
      clearInterval(interval);
      if (bar) bar.style.width = '100%';
      var el = document.getElementById('loading-screen');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() {
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 300);
      }
    }

    // Safety fallback: Pastikan layar loading PASTI lenyap maksimal dalam 2 detik
    // sehingga browser HP tidak akan pernah tertahan layar merah!
    setTimeout(removeLoadingScreen, 2000);

    window.addEventListener('flutter-first-frame', removeLoadingScreen);
  </script>
