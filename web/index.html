<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Peta interaktif gedung Grhatama Pustaka – Balai Layanan Perpustakaan DPAD DIY. Temukan lokasi ruangan di 3 lantai dengan mudah.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C62828">

  <!-- Open Graph -->
  <meta property="og:title" content="Peta Interaktif Grhatama Pustaka">
  <meta property="og:description" content="Temukan lokasi ruangan di Grhatama Pustaka dengan peta interaktif 3 lantai.">
  <meta property="og:type" content="website">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grhatama Pustaka">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>
  <title>Peta Interaktif Grhatama Pustaka</title>
  <link rel="manifest" href="manifest.json">

  <!-- Font Playfair Display untuk logo teks — sama dengan website resmi balaiyanpus -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #C62828;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      color: white;
      text-align: center;
      padding: 24px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo DPAD dari assets */
    #logo-dpad {
      width: 72px;
      height: 72px;
      object-fit: contain;
      opacity: 0.95;
    }

    /* Fallback SVG gedung kalau gambar belum load */
    #logo-fallback {
      display: none;
      width: 72px;
      height: 72px;
    }

    #logo-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      color: white;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    #logo-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.72);
      line-height: 1.55;
      margin-top: 2px;
      letter-spacing: 0.2px;
    }

    #loading-bar-wrap {
      width: 140px;
      height: 2px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: rgba(255,255,255,0.85);
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    flt-glass-pane {
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    flt-glass-pane.ready {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="loading-screen">

    <!-- Logo DPAD dari assets (path relatif ke flutter assets di web) -->
    <img
      id="logo-dpad"
      src="assets/assets/images/logodpad.png"
      alt="Logo DPAD DIY"
      onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';"
    />

    <!-- Fallback jika logo belum tersedia -->
    <svg id="logo-fallback" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="9" y="23" width="54" height="41" rx="2" fill="rgba(255,255,255,0.18)" stroke="white" stroke-width="1.8"/>
      <rect x="18" y="32" width="9" height="9" rx="1.2" fill="white" opacity="0.8"/>
      <rect x="31" y="32" width="9" height="9" rx="1.2" fill="white" opacity="0.8"/>
      <rect x="44" y="32" width="9" height="9" rx="1.2" fill="white" opacity="0.8"/>
      <rect x="18" y="47" width="9" height="9" rx="1.2" fill="white" opacity="0.8"/>
      <rect x="44" y="47" width="9" height="9" rx="1.2" fill="white" opacity="0.8"/>
      <rect x="29" y="47" width="13" height="17" rx="1.2" fill="white"/>
      <polyline points="4,25 36,7 68,25" stroke="white" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
    </svg>

    <div>
      <div id="logo-text">Balai Yanpus</div>
      <div id="logo-sub">Balai Layanan Perpustakaan<br>DPAD DIY</div>
    </div>

    <div id="loading-bar-wrap">
      <div id="loading-bar"></div>
    </div>
  </div>

  <script>
    const bar = document.getElementById('loading-bar');
    let progress = 0;
    const interval = setInterval(() => {
      const step = progress < 50 ? 3 : progress < 75 ? 1.5 : 0.4;
      progress = Math.min(progress + step, 85);
      bar.style.width = progress + '%';
    }, 80);

    window.addEventListener('flutter-first-frame', () => {
      clearInterval(interval);
      bar.style.width = '100%';
      setTimeout(() => {
        const el = document.getElementById('loading-screen');
        if (el) {
          el.style.transition = 'opacity 0.3s ease';
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 350);
        }
        const canvas = document.querySelector('flt-glass-pane');
        if (canvas) canvas.classList.add('ready');
      }, 200);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
